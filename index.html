    <script>
      window.NAHL_FIREBASE = {
        apiKey: "AIzaSyCZ3lbR9qziuBGZUQBF5WlFKMuvtrqM3RY",
        authDomain: "nahl-hifz-club.firebaseapp.com",
        projectId: "nahl-hifz-club",
        storageBucket: "nahl-hifz-club.firebasestorage.app",
        messagingSenderId: "637604191562",
        appId: "1:637604191562:web:7270750ab0cb581a36f5b3"
      };
      window.NAHL_DRIVE_URL = "";
      window.NAHL_DELETE_URL = "https://script.google.com/macros/s/AKfycby2zg9N-99zlKyKjCvCbB3yUycKdqv6p6aRcPy0eqrNvuR7j-VMczWEGpByH4zWPUHE/exec";
      window.NAHL_CLOUD = {cloud:"eu3wqje8", preset:"nahl_hifz"};
      (function () {
        /* NAHL v24 SYNC - delta pulls + server-time stamps + tombstone deletes.
           Builds on v23 (upsert-only, nothing can wipe the cloud):
           - every write stamps updatedAt with SERVER time (phone clocks
             cannot corrupt ordering);
           - after one full pull per device, boots and live updates read
             ONLY documents changed since the last sync (quota-friendly);
           - a record removed in the app is replaced in the cloud by a
             tombstone ({id, __deleted:true}); every device drops it and
             never pushes it back. Admin deletes stick again. */
        /* NAHL v28 SYNC (2026-10-23): delta writes. A per-collection hash
           ledger (nahl.hash.*) remembers the last cloud-known content of
           every record; a push now writes ONLY records that actually
           changed, in batches of at most 450 (Firestore caps a batch at
           500). Unchanged records keep their server updatedAt, so delta
           pulls on other devices stay tiny - the fix for the free-quota
           burn and the 500-record push ceiling. */
        var MAP = {
          "nahl.students": "students",
          "nahl.subs": "submissions",
          "nahl.notes": "notes",
          "nahl.teachers": "teachers",
          "nahl.tracker": "tracker",
          "nahl.salah": "salah"
        };
        var app = firebase.initializeApp(window.NAHL_FIREBASE);
        var db = firebase.firestore();
        var pushing = false;
        function serverTs() { return firebase.firestore.FieldValue.serverTimestamp(); }
        function tsMillis(v) { return (v && typeof v.toMillis === "function") ? v.toMillis() : 0; }
        function loadArr(key) { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; } }
        function saveArr(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} }
        function getDts(key) { var n = parseInt(localStorage.getItem("nahl.dts." + key) || "0", 10); return isNaN(n) ? 0 : n; }
        function setDts(key, n) { try { localStorage.setItem("nahl.dts." + key, String(n)); } catch (e) {} }
        function getTomb(key) { try { return JSON.parse(localStorage.getItem("nahl.tomb." + key) || "{}"); } catch (e) { return {}; } }
        function saveTomb(key, t) { try { localStorage.setItem("nahl.tomb." + key, JSON.stringify(t)); } catch (e) {} }
        function getKnown(key) { try { var v = JSON.parse(localStorage.getItem("nahl.known." + key) || "null"); return Array.isArray(v) ? v : null; } catch (e) { return null; } }
        function saveKnown(key, ids) { try { localStorage.setItem("nahl.known." + key, JSON.stringify(ids)); } catch (e) {} }
        function getLedger(key) { try { var v = JSON.parse(localStorage.getItem("nahl.hash." + key) || "{}"); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; } }
        function saveLedger(key, led) { try { localStorage.setItem("nahl.hash." + key, JSON.stringify(led)); } catch (e) {} }
        function stableStr(v) {
          if (v === null || typeof v !== "object") return JSON.stringify(v);
          if (Array.isArray(v)) return "[" + v.map(stableStr).join(",") + "]";
          return "{" + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ":" + stableStr(v[k]); }).join(",") + "}";
        }
        function hashItem(item) {
          var str = stableStr(item), h = 5381;
          for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
          return str.length + ":" + (h >>> 0).toString(36);
        }
        function cleanItem(item) {
          var clean = Object.assign({}, item);
          if (clean.mediaUrl && (String(clean.mediaUrl).indexOf("blob:") === 0 || String(clean.mediaUrl).length > 800000)) {
            clean.mediaPending = true;
            clean.mediaUrl = null;
          }
          clean.updatedAt = serverTs();
          return clean;
        }
        function pushItems(key, items) {
          var col = MAP[key];
          var valid = items.filter(function (item) { return item && item.id; });
          if (!valid.length) return Promise.resolve();
          var led = getLedger(key);
          var chunks = [];
          for (var i = 0; i < valid.length; i += 450) chunks.push(valid.slice(i, i + 450));
          var chain = Promise.resolve();
          chunks.forEach(function (group) {
            chain = chain.then(function () {
              var batch = db.batch();
              group.forEach(function (item) { batch.set(db.collection(col).doc(String(item.id)), cleanItem(item)); });
              return batch.commit().then(function () {
                group.forEach(function (item) { led[String(item.id)] = hashItem(item); });
                saveLedger(key, led);
              });
            });
          });
          return chain;
        }
        window.nahlPush = function (key, value) {
          var col = MAP[key];
          if (!col || !Array.isArray(value)) return Promise.resolve();
          var tomb = getTomb(key);
          var items = value.filter(function (it) { return it && it.id && !tomb[String(it.id)]; });
          /* v28: write only records whose content changed since the
             last known cloud state; unchanged records are skipped. */
          var led = getLedger(key);
          var changed = items.filter(function (it) { return led[String(it.id)] !== hashItem(it); });
          /* tombstone detection: ids this device knew about that are now gone */
          var removed = [];
          var known = getKnown(key);
          if (known) {
            var nowIds = {};
            items.forEach(function (it) { nowIds[String(it.id)] = 1; });
            known.forEach(function (id) { if (!nowIds[id] && !tomb[id]) removed.push(id); });
            if (removed.length > 3) removed = []; /* safety: a partial write must never mass-delete */
          }
          pushing = true;
          return pushItems(key, changed).then(function () {
            saveKnown(key, items.map(function (it) { return String(it.id); }));
            if (!removed.length) return;
            removed.forEach(function (id) { tomb[id] = Date.now(); delete led[id]; });
            saveTomb(key, tomb);
            saveLedger(key, led);
            /* tombstones travel in their OWN commit: if one is ever
               rejected, the real writes above still stand. */
            var batch = db.batch();
            removed.forEach(function (id) {
              batch.set(db.collection(col).doc(id), { id: id, __deleted: true, updatedAt: serverTs() });
            });
            return batch.commit().catch(function (err) { console.error("Tombstone write failed", err); });
          }).catch(function (err) {
            console.error("Firebase write failed", err);
          }).finally(function () {
            setTimeout(function () { pushing = false; }, 800);
          });
        };
        function mergeDocs(key, docs, fullMode) {
          var local = loadArr(key);
          var tomb = getTomb(key);
          var maxTs = getDts(key);
          var removeSet = {};
          var upserts = [];
          var aliveIds = {};
          docs.forEach(function (d) {
            var data = d.data() || {};
            var id = String(data.id || d.id);
            var ts = tsMillis(data.updatedAt);
            if (ts > maxTs) maxTs = ts;
            if (data.__deleted) { removeSet[id] = 1; tomb[id] = ts || Date.now(); return; }
            aliveIds[id] = 1;
            var item = Object.assign({}, data);
            delete item.updatedAt;
            delete item.__deleted;
            if (!item.id) item.id = id;
            upserts.push(item);
          });
          var out = local.filter(function (it) { return !(it && it.id && removeSet[String(it.id)]); });
          var idx = {};
          out.forEach(function (it, i) { if (it && it.id) idx[String(it.id)] = i; });
          upserts.forEach(function (item) {
            var id = String(item.id);
            if (idx[id] != null) out[idx[id]] = item;
            else { idx[id] = out.length; out.push(item); }
          });
          var extras = [];
          if (fullMode) {
            out = out.filter(function (it) {
              if (!it || !it.id) return true;
              var id = String(it.id);
              if (tomb[id]) return false;
              if (!aliveIds[id]) extras.push(it);
              return true;
            });
          }
          saveArr(key, out);
          if (maxTs > getDts(key)) setDts(key, maxTs);
          saveTomb(key, tomb);
          saveKnown(key, out.filter(function (it) { return it && it.id; }).map(function (it) { return String(it.id); }));
          var led2 = getLedger(key);
          upserts.forEach(function (item) { led2[String(item.id)] = hashItem(item); });
          Object.keys(removeSet).forEach(function (id) { delete led2[id]; });
          saveLedger(key, led2);
          if (extras.length) pushItems(key, extras).catch(function (err) { console.error("Top-up push failed", err); });
        }
        function watch(key) {
          var dts = getDts(key);
          var first = true;
          var resolveFirst = function () {};
          var p = new Promise(function (r) { resolveFirst = r; });
          db.collection(MAP[key]).where("updatedAt", ">=", firebase.firestore.Timestamp.fromMillis(dts)).onSnapshot(function (snap) {
            if (!pushing) {
              var docs = [];
              snap.forEach(function (d) { docs.push(d); });
              if (docs.length) mergeDocs(key, docs, false);
            }
            if (first) { first = false; resolveFirst(); }
          }, function (err) {
            console.error("Sync watch failed", key, err);
            if (first) { first = false; resolveFirst(); }
          });
          return p;
        }
        function bootKey(key) {
          if (!getDts(key)) {
            /* first v24 run on this device: one full pull, then delta forever */
            return db.collection(MAP[key]).get().then(function (snap) {
              var docs = [];
              snap.forEach(function (d) { docs.push(d); });
              mergeDocs(key, docs, true);
            }).catch(function (err) { console.error(err); }).then(function () { return watch(key); });
          }
          return watch(key);
        }
        function start() {
          var s = document.createElement("script");
          s.type = "module";
          s.src = "/assets/index-BV1AdawJ.js";
          document.body.appendChild(s);
        }
        var started = false;
        function go() { if (started) return; started = true; start(); }
        Promise.all(Object.keys(MAP).map(bootKey)).then(go).catch(function (err) { console.error(err); go(); });
        setTimeout(go, 2500);
      })();
    </script>
  
<script>
(function(){
  var PRAYERS=[["fajr","Fajr","\u09ab\u099c\u09b0","\ud83c\udf05"],["dhuhr","Dhuhr","\u09af\u09cb\u09b9\u09b0","\u2600\ufe0f"],["asr","Asr","\u0986\u09b8\u09b0","\ud83c\udf24\ufe0f"],["maghrib","Maghrib","\u09ae\u09be\u0997\u09b0\u09bf\u09ac","\ud83c\udf07"],["isha","Isha","\u098f\u09b6\u09be","\ud83c\udf19"]];
  var JUMUAH=["jumuah","Jumu'ah","\u099c\u09c1\u09ae\u09c1'\u0986","\ud83d\udd4c"];
  var LAUNCH="2026-10-23";
  var DAYS=["Sa","Su","Mo","Tu","We","Th","Fr"];
  function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function prayersFor(k){
    var p=PRAYERS.slice();
    var parts=k.split("-"); var dt=new Date(+parts[0],+parts[1]-1,+parts[2]);
    if(dt.getDay()===5 && k>=LAUNCH) p.splice(2,0,JUMUAH);
    return p;
  }
  function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var since=(x.getDay()+1)%7;x.setDate(x.getDate()-since);return x}
  function countDay(data,k){var row=data[k]; if(!row) return 0; return prayersFor(k).filter(function(p){return row[p[0]]}).length}
  function stats(data){
    var now=new Date(), today=keyOf(now), start=weekStart(now);
    var days=[], week=0, i;
    for(i=0;i<7;i++){var d=new Date(start);d.setDate(start.getDate()+i);var n=countDay(data,keyOf(d));days.push(n);week+=n}
    var dayStars=0, weeks={};
    Object.keys(data).forEach(function(k){
      var n=countDay(data,k); if(n>=prayersFor(k).length) dayStars++;
      var parts=k.split("-"); var dt=new Date(+parts[0],+parts[1]-1,+parts[2]);
      var wk=keyOf(weekStart(dt)); weeks[wk]=(weeks[wk]||0)+n;
    });
    var weekStars=0; Object.keys(weeks).forEach(function(k){ if(weeks[k]>=20) weekStars++; });
    var streak=0, cursor=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(countDay(data,keyOf(cursor))===0) cursor.setDate(cursor.getDate()-1);
    while(countDay(data,keyOf(cursor))>0){streak++; cursor.setDate(cursor.getDate()-1)}
    return {today:today, todayRow:data[today]||{}, todayTarget:prayersFor(today).length, todayN:countDay(data,today), week:week, days:days, stars:dayStars+weekStars, streak:streak};
  }
  function nickname(){
    var s=document.querySelector(".page.student .acct-who small");
    if(!s) return "";
    return (s.textContent||"").replace("Student ID:","").trim();
  }
  function uuidOf(nick){
    try{ var sess=JSON.parse(localStorage.getItem("nahl.session")||"null"); if(sess && sess.studentId) return String(sess.studentId); }catch(e){}
    try{ var arr=JSON.parse(localStorage.getItem("nahl.students")||"[]"); for(var i=0;i<arr.length;i++){ if(arr[i] && arr[i].nickname===nick) return String(arr[i].id); } }catch(e){}
    return "";
  }
  function allRecs(){ try{ var a=JSON.parse(localStorage.getItem("nahl.salah")||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function legacyLoad(nick){ try{ return JSON.parse(localStorage.getItem("nahl-salah-"+nick)||"{}"); }catch(e){ return {}; } }
  function writeRec(uid, days){
    var arr=allRecs(), found=false, i;
    for(i=0;i<arr.length;i++){ if(arr[i] && String(arr[i].id)===uid){ arr[i].days=days; found=true; } }
    if(!found) arr.push({id:uid, days:days});
    try{ localStorage.setItem("nahl.salah", JSON.stringify(arr)); }catch(e){}
    if(window.nahlPush) window.nahlPush("nahl.salah", arr);
  }
  function loadDays(uid, nick){
    if(!uid) return legacyLoad(nick);
    var arr=allRecs(), i;
    for(i=0;i<arr.length;i++){ if(arr[i] && String(arr[i].id)===uid) return arr[i].days||{}; }
    var legacy=legacyLoad(nick);
    if(legacy && Object.keys(legacy).length){ writeRec(uid, legacy); return legacy; }
    return {};
  }
  function saveDays(uid, nick, days){
    if(!uid){ try{ localStorage.setItem("nahl-salah-"+nick, JSON.stringify(days)); }catch(e){} return; }
    writeRec(uid, days);
  }
  function paint(){
    var slot=document.querySelector(".page.student .salah-slot");
    if(!slot) return;
    var nick=nickname();
    if(!nick) return;
    var uid=uuidOf(nick);
    var data=loadDays(uid, nick);
    var st=stats(data);
    var sig=uid+"|"+nick+"|"+st.todayN+"|"+st.week+"|"+st.stars+"|"+st.streak+"|"+JSON.stringify(st.todayRow);
    if(slot.getAttribute("data-sig")===sig) return;
    var pct=Math.min(100, Math.round(st.week/20*100));
    var todayList=prayersFor(st.today);
    var buttons=todayList.map(function(p){
      var on=!!st.todayRow[p[0]];
      return '<button type="button" class="'+(on?"on":"")+'" data-prayer="'+p[0]+'"><i>'+(on?"\u2713":p[3])+'</i><b>'+p[1]+'</b><small>'+p[2]+'</small></button>';
    }).join("");
    var start=weekStart(new Date());
    var week=st.days.map(function(n,i){
      var d=new Date(start); d.setDate(start.getDate()+i); var k=keyOf(d);
      var cls=(n>=prayersFor(k).length?"full":n>0?"some":"")+(k===st.today?" today":"");
      return '<span class="'+cls+'">'+DAYS[i]+'<b>'+n+'</b></span>';
    }).join("");
    var isFri=todayList.length>5;
    slot.innerHTML='<section class="salah-card"><div class="salah-top"><div><small>SALAH CHART</small><h3>'+(isFri?"5 prayers + Jumu'ah":"5 prayers")+'</h3><p>'+st.todayN+'/'+st.todayTarget+' today \u00b7 goal 20</p></div><div class="salah-ring" style="--p:'+pct+'%"><span>'+st.week+'/20<em>week</em></span></div></div><div class="salah-row">'+buttons+'</div><div class="salah-week">'+week+'</div><div class="salah-foot"><span>Salah \u2b50 <b>'+st.stars+'</b></span><span>'+(st.streak?st.streak+' day streak':'Start with one salah')+'</span></div><p class="salah-note">Salah stars save to your account automatically \u2014 no approval needed. Hifz stars stay with the name.</p></section>';
    slot.setAttribute("data-sig", sig);
    slot.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click", function(){
        var d2=loadDays(uid, nick), t=keyOf(new Date());
        d2[t]=d2[t]||{};
        d2[t][btn.getAttribute("data-prayer")]=!d2[t][btn.getAttribute("data-prayer")];
        saveDays(uid, nick, d2);
        slot.removeAttribute("data-sig");
        paint();
      });
    });
  }
  var queued=false;
  function schedule(){ if(queued) return; queued=true; requestAnimationFrame(function(){ queued=false; paint(); }); }
  var root=document.getElementById("root");
  if(root) new MutationObserver(schedule).observe(root,{childList:true,subtree:true});
  schedule();
})();
</script>
